[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-audit"
version = "0.1.0"
description = "Read-only Active Directory privilege-path analysis with evidence-backed findings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AD-Audit contributors" }]
keywords = ["active-directory", "bloodhound", "security-audit", "ldap", "privilege-escalation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
ldap = ["ldap3>=2.9"]
dev = ["pytest>=7"]

[project.scripts]
adaudit = "adaudit.cli:main"
ad-audit = "adaudit.cli:main"

[project.urls]
Source = "https://github.com/0x7f3a/AD-Audit"

[tool.setuptools.packages.find]
include = ["adaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
